# Alternativa legada: não utilizada pelo servidor Baileys atual.

# ═══════════════════════════════════════════════════════════
# WappGR - Evolution API Docker Compose
# 
# Para iniciar: docker compose up -d
# Painel Evolution: http://localhost:8080/manager
# ═══════════════════════════════════════════════════════════

services:
  evolution-api:
    image: ${EVOLUTION_IMAGE:?Defina uma imagem Evolution com versão fixa}
    container_name: wappgr-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # ─── Server ───────────────────────────────
      - SERVER_URL=http://localhost:8080
      - SERVER_PORT=8080
      
      # ─── Authentication ───────────────────────
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Defina a chave Evolution}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      
      # ─── Database (PostgreSQL) ───────────
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URI:?Defina a URI PostgreSQL}
      
      # ─── RabbitMQ (disabled for simplicity) ───
      - RABBITMQ_ENABLED=false
      
      # ─── Websocket ────────────────────────────
      - WEBSOCKET_ENABLED=true
      
      # ─── Logging ──────────────────────────────
      - LOG_LEVEL=WARN
      - LOG_COLOR=true
      
      # ─── Instance cleanup ─────────────────────
      - DEL_INSTANCE=false
      
      # ─── CORS ─────────────────────────────────
      - CORS_ORIGIN=http://localhost:8080
      
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: wappgr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${EVOLUTION_POSTGRES_PASSWORD:?Defina a senha PostgreSQL}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  evolution_instances:
  evolution_store:
  postgres_data:
